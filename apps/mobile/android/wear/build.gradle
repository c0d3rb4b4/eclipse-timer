import groovy.json.JsonSlurper

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

def mobilePackageJson = new JsonSlurper().parse(file("../../package.json"))
def mobileVersionName = (mobilePackageJson.version ?: "1.0.0").toString()
def versionParts = mobileVersionName.tokenize(".")
def parseVersionPart = { List<String> parts, int index ->
    if (index >= parts.size()) {
        return 0
    }
    def raw = parts[index]
    def normalized = raw.replaceAll(/[^0-9].*$/, "")
    if (normalized.isEmpty()) {
        return 0
    }
    return Integer.parseInt(normalized)
}
def major = parseVersionPart(versionParts, 0)
def minor = parseVersionPart(versionParts, 1)
def patch = parseVersionPart(versionParts, 2)
if (major > 99 || minor > 99 || patch > 99) {
    throw new GradleException("Wear versionCode mapping requires major/minor/patch <= 99. Found: $mobileVersionName")
}
def wearVersionCode = (rootProject.ext.targetSdkVersion as int) * 1_000_000 + major * 10_000 + minor * 100 + patch
def isWearReleaseBuildRequested = gradle.startParameter.taskNames.any { taskName ->
    def normalizedTaskName = taskName.toLowerCase()
    normalizedTaskName.contains(":wear:") && normalizedTaskName.contains("release")
}
def injectedSigningProperty = { String key ->
    def fromStartParameter = gradle.startParameter.projectProperties?.get(key)
    if (fromStartParameter != null) {
        return fromStartParameter.toString()
    }
    def fromProject = project.findProperty(key) ?: rootProject.findProperty(key)
    return fromProject == null ? null : fromProject.toString()
}
def injectedStoreFile = injectedSigningProperty("android.injected.signing.store.file")
def injectedStorePassword = injectedSigningProperty("android.injected.signing.store.password")
def injectedKeyAlias = injectedSigningProperty("android.injected.signing.key.alias")
def injectedKeyPassword = injectedSigningProperty("android.injected.signing.key.password")
def hasInjectedReleaseSigning = [injectedStoreFile, injectedStorePassword, injectedKeyAlias, injectedKeyPassword].every {
    it != null && it.trim().length() > 0
}
def wearReleaseSigning = null
if (hasInjectedReleaseSigning) {
    wearReleaseSigning = [
            storeFile    : file(injectedStoreFile),
            storePassword: injectedStorePassword,
            keyAlias     : injectedKeyAlias,
            keyPassword  : injectedKeyPassword,
    ]
}
if (wearReleaseSigning == null) {
    def appProject = rootProject.findProject(":app")
    def appAndroidExtension = appProject?.extensions?.findByName("android")
    def appReleaseSigningConfig = appAndroidExtension?.signingConfigs?.findByName("release")
    if (appReleaseSigningConfig != null) {
        def appStoreFile = appReleaseSigningConfig.storeFile
        def appStorePassword = appReleaseSigningConfig.storePassword?.toString()
        def appKeyAlias = appReleaseSigningConfig.keyAlias?.toString()
        def appKeyPassword = appReleaseSigningConfig.keyPassword?.toString()
        def hasAppReleaseSigning = appStoreFile != null &&
                [appStorePassword, appKeyAlias, appKeyPassword].every { it != null && it.trim().length() > 0 }
        def isDebugLikeSigning = appStoreFile?.toString()?.toLowerCase()?.endsWith("debug.keystore") ||
                (appKeyAlias == "androiddebugkey" && appStorePassword == "android" && appKeyPassword == "android")
        if (hasAppReleaseSigning && !isDebugLikeSigning) {
            wearReleaseSigning = [
                    storeFile    : appStoreFile,
                    storePassword: appStorePassword,
                    keyAlias     : appKeyAlias,
                    keyPassword  : appKeyPassword,
            ]
        }
    }
}
if (isWearReleaseBuildRequested && wearReleaseSigning == null) {
    throw new GradleException("[wear] Missing release signing config. Provide Android signing credentials (for EAS, configure Android credentials for this project) before building :wear release artifacts.")
}

android {
    namespace "com.lallimaven.eclipsetimer.wear"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.lallimaven.eclipsetimer"
        minSdkVersion 26
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode wearVersionCode
        versionName mobileVersionName
    }

    signingConfigs {
        debug {
            storeFile file("../app/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            if (wearReleaseSigning != null) {
                storeFile wearReleaseSigning.storeFile
                storePassword wearReleaseSigning.storePassword
                keyAlias wearReleaseSigning.keyAlias
                keyPassword wearReleaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation "com.google.android.gms:play-services-location:21.3.0"
    implementation "com.google.android.gms:play-services-wearable:19.0.0"
}
