name: Wear OS Emulator Screenshots

on:
  workflow_dispatch:
    inputs:
      device_profile:
        description: "Wear device preset (or auto)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - google-pixel-watch-3-45mm
          - google-pixel-watch-3-41mm
          - google-pixel-watch-2
          - samsung-galaxy-watch7-44mm
          - samsung-galaxy-watch7-40mm
          - wearos-large-round
          - wearos-round
          - wearos-small-round
          - wearos-square
          - wearos-rect
      api_level:
        description: "Android API level for Wear emulator system image"
        required: true
        default: "34"
        type: string
      system_image_abi:
        description: "System image ABI (auto, x86_64, or arm64-v8a)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - x86_64
          - arm64-v8a
      startup_wait_seconds:
        description: "Seconds to wait after app launch before first screenshot"
        required: true
        default: "12"
        type: string
      per_page_wait_seconds:
        description: "Seconds to wait after each deep link"
        required: true
        default: "3"
        type: string
      deep_links:
        description: "Deep links separated by comma or newline"
        required: false
        type: string
        default: "eclipsetimer://wear/live?scenario=gibraltar-between-c1-c3&debugOverlay=on,eclipsetimer://wear/live?scenario=gibraltar-max&debugOverlay=on"

concurrency:
  group: wearos-screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screenshots:
    name: Capture Wear OS Emulator Screenshots
    runs-on: [self-hosted, macOS, eclipse-timer]
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      BUNDLE_ID: com.lallimaven.eclipsetimer
      MAIN_ACTIVITY: com.lallimaven.eclipsetimer.wear.MainActivity
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      SENTRY_ALLOW_FAILURE: "true"
      SENTRY_CLI_EXECUTABLE: "/usr/bin/true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages for Wear build + emulator
        env:
          API_LEVEL: ${{ github.event.inputs.api_level }}
          SYSTEM_IMAGE_ABI: ${{ github.event.inputs.system_image_abi }}
        run: |
          set -euo pipefail

          if [[ ! "$API_LEVEL" =~ ^[0-9]+$ ]]; then
            echo "api_level must be an integer."
            exit 1
          fi

          selected_abi="$SYSTEM_IMAGE_ABI"
          if [ "$selected_abi" = "auto" ]; then
            if [ "$(uname -m)" = "arm64" ]; then
              selected_abi="arm64-v8a"
            else
              selected_abi="x86_64"
            fi
          fi

          sdk_root=""
          for candidate in \
            "${ANDROID_SDK_ROOT:-}" \
            "${ANDROID_HOME:-}" \
            "$HOME/Library/Android/sdk" \
            "$HOME/Android/Sdk" \
            "/usr/local/share/android-sdk" \
            "/opt/homebrew/share/android-sdk"
          do
            if [ -n "$candidate" ] && [ -d "$candidate" ]; then
              sdk_root="$candidate"
              break
            fi
          done

          if [ ! -d "$sdk_root" ]; then
            echo "Android SDK directory not found."
            echo "Install Android SDK on the runner or set ANDROID_SDK_ROOT/ANDROID_HOME."
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "SCREENSHOT_SYSTEM_IMAGE_ABI=$selected_abi" >> "$GITHUB_ENV"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk_root/emulator" >> "$GITHUB_PATH"
          if [ -d "$sdk_root/cmdline-tools/latest/bin" ]; then
            echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi

          system_image_package="system-images;android-${API_LEVEL};android-wear;${selected_abi}"
          system_image_dir="$sdk_root/system-images/android-${API_LEVEL}/android-wear/${selected_abi}"

          missing_packages=()
          [ -d "$sdk_root/platform-tools" ] || missing_packages+=("platform-tools")
          [ -d "$sdk_root/emulator" ] || missing_packages+=("emulator")
          [ -d "$sdk_root/platforms/android-36" ] || missing_packages+=("platforms;android-36")
          [ -d "$sdk_root/build-tools/36.0.0" ] || missing_packages+=("build-tools;36.0.0")
          [ -d "$sdk_root/ndk/27.1.12297006" ] || missing_packages+=("ndk;27.1.12297006")
          [ -d "$system_image_dir" ] || missing_packages+=("$system_image_package")

          if [ "${#missing_packages[@]}" -eq 0 ]; then
            echo "All required Android SDK packages are already installed in $sdk_root."
            exit 0
          fi

          echo "Installing missing Android SDK packages: ${missing_packages[*]}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "${missing_packages[@]}"

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm

      - name: Build Wear OS APK
        working-directory: apps/mobile
        env:
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/raw
        run: |
          set -euo pipefail

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root" ]; then
            echo "ANDROID_SDK_ROOT/ANDROID_HOME is not configured."
            exit 1
          fi

          export ANDROID_SDK_ROOT="$sdk_root"
          export ANDROID_HOME="$sdk_root"
          escaped_sdk_root="${sdk_root// /\\ }"
          printf 'sdk.dir=%s\n' "$escaped_sdk_root" > android/local.properties
          echo "Using Android SDK at $sdk_root"

          pnpm exec eas build --platform android --profile production-wear-apk --local --non-interactive

      - name: Resolve Wear OS APK artifact
        id: resolve_apk
        run: |
          set -euo pipefail
          artifacts_dir="$GITHUB_WORKSPACE/artifacts/raw"
          apk_path="$(find "$artifacts_dir" -type f -name 'wear-release.apk' | head -n 1 || true)"
          if [ -z "$apk_path" ]; then
            apk_path="$(find "$artifacts_dir" -type f -name '*.apk' | grep -i 'wear' | head -n 1 || true)"
          fi
          if [ -z "$apk_path" ]; then
            apk_path="$(find "$artifacts_dir" -type f -name '*.apk' | head -n 1 || true)"
          fi

          if [ -z "$apk_path" ]; then
            echo "Could not find Wear OS APK artifact in $artifacts_dir."
            find "$artifacts_dir" -maxdepth 3 -print || true
            exit 1
          fi

          echo "Using APK: $apk_path"
          {
            echo "apk_path<<EOF"
            echo "$apk_path"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Boot Wear emulator and capture screenshots
        id: capture
        env:
          DEVICE_PROFILE: ${{ github.event.inputs.device_profile }}
          API_LEVEL: ${{ github.event.inputs.api_level }}
          STARTUP_WAIT_SECONDS: ${{ github.event.inputs.startup_wait_seconds }}
          PER_PAGE_WAIT_SECONDS: ${{ github.event.inputs.per_page_wait_seconds }}
          APP_PATH: ${{ steps.resolve_apk.outputs.apk_path }}
        run: |
          set -euo pipefail

          if [[ ! "$API_LEVEL" =~ ^[0-9]+$ ]]; then
            echo "api_level must be an integer."
            exit 1
          fi
          if [[ ! "$STARTUP_WAIT_SECONDS" =~ ^[0-9]+$ ]]; then
            echo "startup_wait_seconds must be an integer."
            exit 1
          fi
          if [[ ! "$PER_PAGE_WAIT_SECONDS" =~ ^[0-9]+$ ]]; then
            echo "per_page_wait_seconds must be an integer."
            exit 1
          fi
          if [ ! -f "$APP_PATH" ]; then
            echo "APK not found at $APP_PATH."
            exit 1
          fi

          # Extra settle time so the Wear app picks up emulator geo changes
          # before we deep-link and capture the first screenshot.
          LOCATION_SETTLE_SECONDS=12

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root" ]; then
            echo "ANDROID_SDK_ROOT/ANDROID_HOME is not configured."
            exit 1
          fi

          export ANDROID_SDK_ROOT="$sdk_root"
          export ANDROID_HOME="$sdk_root"
          export PATH="$sdk_root/platform-tools:$sdk_root/emulator:$PATH"
          if [ -d "$sdk_root/cmdline-tools/latest/bin" ]; then
            export PATH="$sdk_root/cmdline-tools/latest/bin:$PATH"
          fi

          running_emulators="$(adb devices | awk '/^emulator-[0-9]+\t(device|offline)$/{print $1}')"
          if [ -n "$running_emulators" ]; then
            while IFS= read -r serial; do
              [ -z "$serial" ] && continue
              adb -s "$serial" emu kill || true
            done <<< "$running_emulators"
            sleep 5
          fi

          system_image="system-images;android-${API_LEVEL};android-wear;${SCREENSHOT_SYSTEM_IMAGE_ABI}"
          device_suffix="$(printf '%s' "${DEVICE_PROFILE:-auto}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"
          [ -z "$device_suffix" ] && device_suffix="auto"
          avd_name="eclipse-timer-wear-${API_LEVEL}-${device_suffix}"

          list_device_profiles() {
            avdmanager list device | awk '
              $1 == "id:" {
                id = "";
                quoted_parts = split($0, parts, "\"");
                if (quoted_parts >= 2) {
                  id = parts[2];
                } else {
                  id = $2;
                }
                next;
              }
              $1 == "Name:" {
                name = $0;
                sub(/^[[:space:]]*Name:[[:space:]]*/, "", name);
                if (id != "") {
                  printf "%s|%s\n", id, name;
                }
              }
            '
          }

          select_default_wear_profile() {
            local profiles
            local selected
            profiles="$(list_device_profiles)"
            selected="$(printf '%s\n' "$profiles" | grep -Ei 'wear|watch' | grep -Ei '^wear|wearos|[|].*(Wear|Watch)' | head -n 1 | cut -d'|' -f1 || true)"
            if [ -z "$selected" ]; then
              selected="$(printf '%s\n' "$profiles" | grep -Ei 'wear|watch' | head -n 1 | cut -d'|' -f1 || true)"
            fi
            printf '%s' "$selected"
          }

          select_profile_by_patterns() {
            local profiles
            local selected
            local pattern
            profiles="$(list_device_profiles)"
            for pattern in "$@"; do
              selected="$(printf '%s\n' "$profiles" | grep -Ei "$pattern" | head -n 1 | cut -d'|' -f1 || true)"
              if [ -n "$selected" ]; then
                printf '%s' "$selected"
                return 0
              fi
            done
            return 1
          }

          resolve_wear_profile_preset() {
            local preset="$1"
            case "$preset" in
              google-pixel-watch-3-45mm|samsung-galaxy-watch7-44mm|wearos-large-round)
                select_profile_by_patterns 'pixel[[:space:]]*watch[[:space:]]*3.*45|wear.*large.*round|wearos_large_round' 'wear.*round|wearos_round' || true
                ;;
              google-pixel-watch-3-41mm|google-pixel-watch-2|samsung-galaxy-watch7-40mm|wearos-round)
                select_profile_by_patterns 'pixel[[:space:]]*watch[[:space:]]*(3|2)|wear.*round|wearos_round' 'wear.*small.*round|wearos_small_round' || true
                ;;
              wearos-small-round)
                select_profile_by_patterns 'wear.*small.*round|wearos_small_round' 'wear.*round|wearos_round' || true
                ;;
              wearos-square)
                select_profile_by_patterns 'wear.*square|wearos_square' 'wear.*rect|wearos_rect' || true
                ;;
              wearos-rect)
                select_profile_by_patterns 'wear.*rect|wearos_rect' 'wear.*square|wearos_square' || true
                ;;
              *)
                printf '%s' "$preset"
                ;;
            esac
          }

          create_avd() {
            local profile="$1"
            if [ -n "$profile" ]; then
              if echo "no" | avdmanager create avd -n "$avd_name" -k "$system_image" --device "$profile" --force; then
                return 0
              fi
              echo "::warning::Unable to use device profile '$profile'. Retrying with default profile."
            fi
            echo "no" | avdmanager create avd -n "$avd_name" -k "$system_image" --force
          }

          selected_device_profile="${DEVICE_PROFILE:-auto}"
          if [ "$selected_device_profile" = "auto" ]; then
            selected_device_profile="$(select_default_wear_profile)"
            if [ -n "$selected_device_profile" ]; then
              echo "Auto-selected Wear device profile: $selected_device_profile"
            else
              echo "::warning::Could not auto-select a Wear device profile. Falling back to SDK default profile."
            fi
          else
            resolved_profile="$(resolve_wear_profile_preset "$selected_device_profile")"
            if [ -n "$resolved_profile" ]; then
              selected_device_profile="$resolved_profile"
              echo "Requested Wear preset '${DEVICE_PROFILE:-auto}' resolved to profile: $selected_device_profile"
            else
              echo "::warning::Unable to resolve Wear preset '${DEVICE_PROFILE:-auto}'. Falling back to auto selection."
              selected_device_profile="$(select_default_wear_profile)"
            fi
          fi

          if ! avdmanager list avd | grep -Fq "Name: $avd_name"; then
            create_avd "$selected_device_profile"
          fi

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          emulator_log="$GITHUB_WORKSPACE/artifacts/wear-emulator.log"
          "$sdk_root/emulator/emulator" \
            -avd "$avd_name" \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -no-snapshot-save \
            >"$emulator_log" 2>&1 &
          emulator_pid=$!

          emulator_serial=""
          for _ in {1..120}; do
            emulator_serial="$(adb devices | awk '/^emulator-[0-9]+\t(device|offline)$/{print $1; exit}')"
            [ -n "$emulator_serial" ] && break
            sleep 2
          done

          if [ -z "$emulator_serial" ]; then
            echo "Wear emulator did not start."
            tail -n 200 "$emulator_log" || true
            exit 1
          fi

          adb -s "$emulator_serial" wait-for-device

          echo "Attempting adb root for emulator clock control (best-effort)..."
          adb_root_output="$(adb -s "$emulator_serial" root </dev/null 2>&1 || true)"
          printf '%s\n' "$adb_root_output" | head -5
          adb -s "$emulator_serial" wait-for-device || true
          echo "adbd identity:"
          adb -s "$emulator_serial" shell id </dev/null 2>&1 | head -3 || true

          boot_completed=""
          for _ in {1..180}; do
            boot_completed="$(adb -s "$emulator_serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$boot_completed" = "1" ]; then
              break
            fi
            sleep 2
          done

          if [ "$boot_completed" != "1" ]; then
            echo "Wear emulator failed to boot."
            tail -n 200 "$emulator_log" || true
            exit 1
          fi

          adb -s "$emulator_serial" shell settings put global window_animation_scale 0 || true
          adb -s "$emulator_serial" shell settings put global transition_animation_scale 0 || true
          adb -s "$emulator_serial" shell settings put global animator_duration_scale 0 || true
          adb -s "$emulator_serial" shell input keyevent 82 || true

          adb -s "$emulator_serial" install -r "$APP_PATH"

          adb -s "$emulator_serial" shell pm grant "$BUNDLE_ID" android.permission.ACCESS_FINE_LOCATION || true
          adb -s "$emulator_serial" shell pm grant "$BUNDLE_ID" android.permission.ACCESS_COARSE_LOCATION || true

          echo "Disabling automatic time/timezone updates..."
          adb -s "$emulator_serial" shell settings put global auto_time 0 || true
          adb -s "$emulator_serial" shell settings put global auto_time_zone 0 || true
          
          # Verify settings
          auto_time_status="$(adb -s "$emulator_serial" shell settings get global auto_time 2>/dev/null | tr -d '\r')"
          echo "Auto time status: $auto_time_status"
          
          # Wake up the device
          adb -s "$emulator_serial" shell input keyevent KEYCODE_WAKEUP || true
          sleep 1

          log_emulator_time_state() {
            local label="$1"
            local current_epoch
            local current_utc
            local auto_time_setting
            local timezone_value
            current_epoch="$(adb -s "$emulator_serial" shell date +%s </dev/null 2>/dev/null | tr -d '\r' || true)"
            current_utc="$(adb -s "$emulator_serial" shell date -u </dev/null 2>/dev/null | tr -d '\r' || true)"
            auto_time_setting="$(adb -s "$emulator_serial" shell settings get global auto_time </dev/null 2>/dev/null | tr -d '\r' || true)"
            timezone_value="$(adb -s "$emulator_serial" shell getprop persist.sys.timezone </dev/null 2>/dev/null | tr -d '\r' || true)"
            echo "$label: epoch=$current_epoch utc='$current_utc' auto_time=$auto_time_setting timezone=$timezone_value"
          }

          echo "Emulator console help snapshot:"
          adb -s "$emulator_serial" emu help </dev/null 2>&1 | head -40 || true

          set_emulator_time_utc() {
            local iso_utc="$1"
            
            echo "Setting emulator time to: $iso_utc"
            log_emulator_time_state "Clock state before set"
            
            # Convert to Unix timestamp (seconds since epoch)
            local timestamp_sec
            timestamp_sec="$(date -u -j -f "%Y-%m-%dT%H:%M:%SZ" "$iso_utc" "+%s" 2>/dev/null)"
            
            if [ -n "$timestamp_sec" ]; then
              # Convert to milliseconds for emulator console
              local timestamp_ms="${timestamp_sec}000"
              echo "Using emulator console to set time (timestamp ms: $timestamp_ms)"
              
              # Prefer emulator console clock command first.
              if setclock_output="$(adb -s "$emulator_serial" emu avd setclock "$timestamp_ms" </dev/null 2>&1)"; then
                printf '%s\n' "$setclock_output" | head -5
                echo "Time set via emulator console clock"
              else
                printf '%s\n' "$setclock_output" | head -5
                echo "::warning::Emulator console clock command failed; falling back to shell date command."
              fi

              # Try using adb shell date command with formatted time.
              local date_format
              date_format="$(date -u -j -f "%Y-%m-%dT%H:%M:%SZ" "$iso_utc" "+%m%d%H%M%Y.%S" 2>/dev/null)"
              echo "Trying to set date to: $date_format"

              if shell_date_output="$(adb -s "$emulator_serial" shell "settings put global auto_time 0; date -u $date_format" </dev/null 2>&1)"; then
                printf '%s\n' "$shell_date_output" | head -5
              else
                printf '%s\n' "$shell_date_output" | head -5
                echo "::warning::Shell date command failed. Continuing with emulator-provided clock."
              fi

              # Broadcast time-set change in case framework listeners need a nudge.
              adb -s "$emulator_serial" shell am broadcast -a android.intent.action.TIME_SET </dev/null >/dev/null 2>&1 || true
            else
              echo "::warning::Failed to parse timestamp from $iso_utc"
            fi
            
            sleep 2
            
            # Verify time was set
            current_time="$(adb -s "$emulator_serial" shell date -u </dev/null 2>/dev/null | tr -d '\r')"
            current_epoch="$(adb -s "$emulator_serial" shell date +%s </dev/null 2>/dev/null | tr -d '\r')"
            echo "Emulator time is now: $current_time (epoch=$current_epoch, target_epoch=$timestamp_sec)"
            if [[ "$current_epoch" =~ ^[0-9]+$ ]] && [[ "$timestamp_sec" =~ ^[0-9]+$ ]]; then
              delta_sec="$((current_epoch - timestamp_sec))"
              if [ "$delta_sec" -lt 0 ]; then
                delta_sec=$(( -delta_sec ))
              fi
              if [ "$delta_sec" -gt 120 ]; then
                echo "::warning::Emulator clock did not move close to requested UTC time (delta=${delta_sec}s)."
              fi
            fi
            log_emulator_time_state "Clock state after set"
          }

          set_emulator_geo_gibraltar() {
            local lat="36.1319"
            local lon="-5.3409"
            echo "Setting emulator GPS to Gibraltar: lat=$lat, lon=$lon"
            
            # Use emulator console command
            if adb -s "$emulator_serial" emu geo fix "$lon" "$lat" 0 </dev/null 2>&1; then
              echo "GPS location set via emulator console"
            else
              echo "::warning::Failed to set GPS location via emulator console"
            fi
            
            sleep 2
            
            # Verify location provider is enabled
            location_mode="$(adb -s "$emulator_serial" shell settings get secure location_mode </dev/null 2>/dev/null | tr -d '\r')"
            echo "Location mode: $location_mode (3=high accuracy)"
          }

          wait_for_app_foreground() {
            local package_name="$1"
            for _ in {1..30}; do
              if adb -s "$emulator_serial" shell dumpsys activity activities </dev/null 2>/dev/null | grep -E 'mResumedActivity|topResumedActivity|mFocusedApp' | grep -Fq "$package_name"; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          open_deep_link() {
            local url="$1"
            local tmpout="/tmp/deeplink_output_$$.txt"
            local escaped_url
            escaped_url="$(printf '%s' "$url" | sed "s/'/'\\\\''/g")"

            adb -s "$emulator_serial" shell am force-stop "$BUNDLE_ID" </dev/null >/dev/null 2>&1 || true
            sleep 1

            echo "Attempting to open deep link: $url"
            if adb -s "$emulator_serial" shell "am start -W -a android.intent.action.VIEW -c android.intent.category.BROWSABLE -d '$escaped_url' -p '$BUNDLE_ID'" </dev/null >"$tmpout" 2>&1; then
              echo "Deep link opened successfully (method 1)"
              rm -f "$tmpout"
              return 0
            fi
            
            echo "Method 1 failed, output:"
            cat "$tmpout" 2>/dev/null | head -10
            if grep -Fq "Status: ok" "$tmpout"; then
              echo "::warning::Method 1 returned non-zero but am start reported Status: ok. Treating as success."
              rm -f "$tmpout"
              return 0
            fi

            if adb -s "$emulator_serial" shell "am start -S -W -a android.intent.action.VIEW -d '$escaped_url' -n '$BUNDLE_ID/$MAIN_ACTIVITY'" </dev/null >"$tmpout" 2>&1; then
              echo "Deep link opened successfully (method 2)"
              rm -f "$tmpout"
              return 0
            fi
            
            echo "Method 2 failed, output:"
            cat "$tmpout" 2>/dev/null | head -10
            if grep -Fq "Status: ok" "$tmpout"; then
              echo "::warning::Method 2 returned non-zero but am start reported Status: ok. Treating as success."
              rm -f "$tmpout"
              return 0
            fi
            rm -f "$tmpout"

            return 1
          }

          shots_dir="$GITHUB_WORKSPACE/artifacts/screenshots"
          mkdir -p "$shots_dir"
          printf "index,url,file\n" > "$shots_dir/manifest.csv"

          adb -s "$emulator_serial" shell am start -W -n "$BUNDLE_ID/$MAIN_ACTIVITY" </dev/null >/dev/null 2>&1 || true
          if ! wait_for_app_foreground "$BUNDLE_ID"; then
            echo "::warning::App did not enter the foreground after initial launch."
          fi
          sleep "$STARTUP_WAIT_SECONDS"

          DEEP_LINKS_INPUT="$(cat <<'EOF'
          ${{ github.event.inputs.deep_links }}
          EOF
          )"
          echo "=== DEBUG: Raw input ==="
          printf '%s\n' "$DEEP_LINKS_INPUT"
          echo "=== END Raw input ==="
          
          deep_links="$(
            printf '%s\n' "$DEEP_LINKS_INPUT" \
              | tr -d '\r' \
              | tr ',' '\n' \
              | sed -E 's#([A-Za-z][A-Za-z0-9+.-]*://)#\n\1#g' \
              | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' \
              | sed '/^[[:space:]]*$/d'
          )"
          
          echo "=== DEBUG: Parsed links ==="
          printf '%s\n' "$deep_links" | while IFS= read -r line; do
            printf "Line: [%s]\n" "$line"
          done
          echo "=== END Parsed links ==="
          
          link_count="$(printf '%s\n' "$deep_links" | grep -c '://' || echo 0)"
          echo "DEBUG: Link count by grep: $link_count"

          if [ -n "$deep_links" ]; then
            index=1
            echo "Processing $link_count deep link(s)..."
            echo "=== Starting while loop ==="
            while IFS= read -r url; do
              echo "DEBUG: Loop iteration started, index=$index"
              echo "DEBUG: Read url='$url'"
              echo "DEBUG: URL length=${#url}"
              
              if [ -z "$url" ]; then
                echo "DEBUG: Empty url, skipping"
                continue
              fi

              echo "[$index] Processing: $url"

              case "$url" in
                *gibraltar-between-c1-c3*)
                  echo "Detected gibraltar-between-c1-c3 scenario"
                  set_emulator_geo_gibraltar
                  echo "Waiting ${LOCATION_SETTLE_SECONDS}s for GPS changes to propagate..."
                  sleep "$LOCATION_SETTLE_SECONDS"
                  set_emulator_time_utc "2027-08-02T08:18:36Z"
                  echo "Waiting 2 seconds for UTC time change to propagate..."
                  sleep 2
                  ;;
                *gibraltar-max*)
                  echo "Detected gibraltar-max scenario"
                  set_emulator_geo_gibraltar
                  echo "Waiting ${LOCATION_SETTLE_SECONDS}s for GPS changes to propagate..."
                  sleep "$LOCATION_SETTLE_SECONDS"
                  set_emulator_time_utc "2027-08-02T08:48:00Z"
                  echo "Waiting 2 seconds for UTC time change to propagate..."
                  sleep 2
                  ;;
              esac

              slug="$(printf '%s' "$url" | sed -E 's#^[a-zA-Z][a-zA-Z0-9+.-]*://##; s#[^A-Za-z0-9._-]+#-#g; s#-+#-#g; s#^-##; s#-$##')"
              if [ -z "$slug" ]; then
                slug="screen-$index"
              fi
              filename="$(printf '%02d' "$index")-$slug.png"

              if open_deep_link "$url"; then
                echo "[$index] Deep link opened successfully"
                if ! wait_for_app_foreground "$BUNDLE_ID"; then
                  echo "::warning::Deep link opened but app is not foregrounded: $url"
                  index=$((index + 1))
                  continue
                fi
                echo "[$index] App is in foreground, waiting ${PER_PAGE_WAIT_SECONDS}s before screenshot..."
                sleep "$PER_PAGE_WAIT_SECONDS"
                if adb -s "$emulator_serial" exec-out screencap -p </dev/null > "$shots_dir/$filename"; then
                  echo "[$index] Screenshot saved: $filename"
                  printf "%02d,%s,%s\n" "$index" "$url" "$filename" >> "$shots_dir/manifest.csv"
                else
                  echo "::error::Failed to capture screenshot for: $url"
                fi
              else
                echo "::warning::Failed to open deep link: $url"
              fi

              echo "DEBUG: End of loop iteration $index, incrementing..."
              index=$((index + 1))
              echo "DEBUG: New index=$index"
            done <<< "$deep_links"
            echo "=== While loop completed ==="
            echo "Completed processing deep links"
          else
            echo "::warning::No deep links to process"
          fi

          {
            echo "emulator_serial=$emulator_serial"
            echo "emulator_pid=$emulator_pid"
          } >> "$GITHUB_OUTPUT"

      - name: Shutdown emulator
        if: always()
        run: |
          set -euo pipefail
          emulator_serial="${{ steps.capture.outputs.emulator_serial }}"
          emulator_pid="${{ steps.capture.outputs.emulator_pid }}"

          if [ -n "$emulator_serial" ]; then
            adb -s "$emulator_serial" emu kill || true
          fi

          if [ -n "$emulator_pid" ] && kill -0 "$emulator_pid" >/dev/null 2>&1; then
            kill "$emulator_pid" || true
          fi

      - name: Package screenshots archive
        id: package_archive
        run: |
          set -euo pipefail
          screenshots_dir="$GITHUB_WORKSPACE/artifacts/screenshots"
          release_dir="$GITHUB_WORKSPACE/artifacts/release"
          archive_name="wearos-emulator-screenshots-${GITHUB_RUN_ID}.zip"
          archive_path="$release_dir/$archive_name"

          if [ ! -d "$screenshots_dir" ]; then
            echo "Screenshots directory not found: $screenshots_dir"
            exit 1
          fi

          mkdir -p "$release_dir"
          ditto -c -k --sequesterRsrc --keepParent "$screenshots_dir" "$archive_path"

          {
            echo "archive_name=$archive_name"
            echo "archive_path=$archive_path"
          } >> "$GITHUB_OUTPUT"

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: wearos-emulator-screenshots-${{ github.run_id }}
          path: ${{ steps.package_archive.outputs.archive_path }}
          if-no-files-found: error

      - name: Resolve latest GitHub release
        id: latest_release
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data: release } = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });

              core.info(`Using latest release: ${release.tag_name} (id: ${release.id})`);
              core.setOutput("release_id", String(release.id));
              core.setOutput("tag_name", release.tag_name);
            } catch (error) {
              core.setFailed(`Unable to resolve latest release: ${error.message}`);
            }

      - name: Attach screenshots archive to latest release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.latest_release.outputs.release_id }}
          RELEASE_TAG_NAME: ${{ steps.latest_release.outputs.tag_name }}
          SCREENSHOTS_ARCHIVE_NAME: ${{ steps.package_archive.outputs.archive_name }}
          SCREENSHOTS_ARCHIVE_PATH: ${{ steps.package_archive.outputs.archive_path }}
        with:
          script: |
            const fs = require("fs");

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releaseId = Number(process.env.RELEASE_ID);
            const releaseTag = process.env.RELEASE_TAG_NAME || "unknown";
            const archiveName = process.env.SCREENSHOTS_ARCHIVE_NAME || "";
            const archivePath = process.env.SCREENSHOTS_ARCHIVE_PATH || "";

            if (!Number.isFinite(releaseId) || releaseId <= 0) {
              core.setFailed(`Invalid release id: ${process.env.RELEASE_ID}`);
              return;
            }

            if (!archiveName || !archivePath) {
              core.setFailed("Screenshot archive metadata is missing.");
              return;
            }

            if (!fs.existsSync(archivePath)) {
              core.setFailed(`Screenshots archive not found: ${archivePath}`);
              return;
            }

            const existingAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: releaseId,
              per_page: 100,
            });
            const existingAssetsByName = new Map(existingAssets.map((asset) => [asset.name, asset]));
            const previous = existingAssetsByName.get(archiveName);
            if (previous) {
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: previous.id,
              });
              core.info(`Deleted existing asset: ${archiveName}`);
            }

            const data = fs.readFileSync(archivePath);
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: releaseId,
              name: archiveName,
              data,
            });
            core.info(`Uploaded ${archiveName} to release ${releaseTag}`);
