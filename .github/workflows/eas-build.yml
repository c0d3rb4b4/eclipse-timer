name: Self-Hosted Mobile Build & Submit

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - ios
          - android
      submit:
        description: "Submit to stores after build"
        required: false
        default: false
        type: boolean

concurrency:
  group: self-hosted-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI checks
    runs-on: [self-hosted, macOS, eclipse-timer]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  build:
    name: Local Build (${{ github.event.inputs.platform || 'all' }})
    needs: ci
    runs-on: [self-hosted, macOS, eclipse-timer]
    env:
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      SENTRY_DISABLE_XCODE_DEBUG_UPLOAD: "true"
      SENTRY_ALLOW_FAILURE: "true"
      SENTRY_CLI_EXECUTABLE: "/usr/bin/true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java (Android builds)
        if: ${{ (github.event.inputs.platform || 'all') != 'ios' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK tools (Android builds)
        if: ${{ (github.event.inputs.platform || 'all') != 'ios' }}
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages (Android builds)
        if: ${{ (github.event.inputs.platform || 'all') != 'ios' }}
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm

      - name: Validate Google Maps Android key
        if: ${{ (github.event.inputs.platform || 'all') != 'ios' }}
        run: |
          if [ -z "$GOOGLE_MAPS_ANDROID_API_KEY" ]; then
            echo "Missing GOOGLE_MAPS_ANDROID_API_KEY GitHub secret."
            echo "Add it in: Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Build
        working-directory: apps/mobile
        env:
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/raw
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
          SENTRY_DISABLE_XCODE_DEBUG_UPLOAD: "true"
          SENTRY_ALLOW_FAILURE: "true"
          SENTRY_CLI_EXECUTABLE: "/usr/bin/true"
        run: |
          set -euo pipefail
          platform="${{ github.event.inputs.platform || 'all' }}"

          if [ "$platform" = "all" ] || [ "$platform" = "ios" ]; then
            pnpm exec eas build --profile production --platform ios --local --non-interactive
          fi

          if [ "$platform" = "all" ] || [ "$platform" = "android" ]; then
            sdk_root=""
            for candidate in \
              "${ANDROID_SDK_ROOT:-}" \
              "${ANDROID_HOME:-}" \
              "$HOME/Library/Android/sdk" \
              "$HOME/Android/Sdk" \
              "/usr/local/share/android-sdk" \
              "/opt/homebrew/share/android-sdk"
            do
              if [ -n "$candidate" ] && [ -d "$candidate" ]; then
                sdk_root="$candidate"
                break
              fi
            done

            if [ ! -d "$sdk_root" ]; then
              echo "Android SDK directory not found."
              echo "Install Android SDK on the runner or set ANDROID_SDK_ROOT/ANDROID_HOME."
              exit 1
            fi

            export ANDROID_SDK_ROOT="$sdk_root"
            export ANDROID_HOME="$sdk_root"
            escaped_sdk_root="${sdk_root// /\\ }"
            printf 'sdk.dir=%s\n' "$escaped_sdk_root" > android/local.properties
            echo "Using Android SDK at $sdk_root"

            pnpm exec eas build --profile production --platform android --local --non-interactive
          fi

      - name: Collect build artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts/submission
          platform="${{ github.event.inputs.platform || 'all' }}"

          if [ "$platform" = "all" ] || [ "$platform" = "ios" ]; then
            ios_artifact="$(find artifacts/raw -type f -name '*.ipa' | head -n 1 || true)"
            if [ -z "$ios_artifact" ]; then
              echo "Missing iOS artifact (.ipa) in artifacts/raw."
              exit 1
            fi
            cp "$ios_artifact" artifacts/submission/ios.ipa
          fi

          if [ "$platform" = "all" ] || [ "$platform" = "android" ]; then
            android_artifact="$(find artifacts/raw -type f -name '*.aab' | head -n 1 || true)"
            if [ -z "$android_artifact" ]; then
              echo "Missing Android artifact (.aab) in artifacts/raw."
              exit 1
            fi
            cp "$android_artifact" artifacts/submission/android.aab
          fi

          ls -lah artifacts/submission

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-mobile-builds-${{ github.run_id }}
          path: artifacts/submission
          if-no-files-found: error

  submit:
    name: Submit to stores
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.submit == 'true'
    runs-on: [self-hosted, macOS, eclipse-timer]
    permissions:
      contents: write
    environment: production # Requires manual approval in GitHub settings

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version bump
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest_tag="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"
          LATEST_TAG="$latest_tag" node - <<'NODE'
          const fs = require('fs');

          const app = JSON.parse(fs.readFileSync('apps/mobile/app.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('apps/mobile/package.json', 'utf8'));
          const latestTag = process.env.LATEST_TAG || '';

          const packageVersion = pkg.version;
          const expoVersion = app?.expo?.version;
          const runtimeVersion = app?.expo?.runtimeVersion;
          const semver = /^\d+\.\d+\.\d+$/;

          const fail = (message) => {
            console.error(message);
            process.exit(1);
          };

          if (typeof packageVersion !== 'string' || !semver.test(packageVersion)) {
            fail(`apps/mobile/package.json version must be x.y.z. Found: ${packageVersion}`);
          }

          if (typeof expoVersion !== 'string' || !semver.test(expoVersion)) {
            fail(`apps/mobile/app.json expo.version must be x.y.z. Found: ${expoVersion}`);
          }

          if (typeof runtimeVersion !== 'string' || !semver.test(runtimeVersion)) {
            fail(
              `apps/mobile/app.json expo.runtimeVersion must be x.y.z. Found: ${JSON.stringify(
                runtimeVersion
              )}`
            );
          }

          if (packageVersion !== expoVersion || packageVersion !== runtimeVersion) {
            fail(
              `Version mismatch detected. package.json=${packageVersion}, app.json.expo.version=${expoVersion}, app.json.expo.runtimeVersion=${runtimeVersion}`
            );
          }

          const parse = (value) => value.split('.').map((part) => Number(part));
          const compare = (left, right) => left[0] - right[0] || left[1] - right[1] || left[2] - right[2];
          const currentVersion = packageVersion;
          const latestVersion = latestTag.replace(/^v/, '');

          if (latestTag) {
            if (!semver.test(latestVersion)) {
              fail(`Latest release tag must use format vX.Y.Z. Found: ${latestTag}`);
            }

            if (compare(parse(currentVersion), parse(latestVersion)) <= 0) {
              fail(
                `Release version must be incremented. Current version ${currentVersion} must be greater than latest tag ${latestTag}.`
              );
            }
          }

          const outputPath = process.env.GITHUB_OUTPUT;
          if (!outputPath) {
            fail('GITHUB_OUTPUT is not set.');
          }

          fs.appendFileSync(outputPath, `version=${currentVersion}\n`);
          fs.appendFileSync(outputPath, `tag_name=v${currentVersion}\n`);
          fs.appendFileSync(outputPath, `release_name=Eclipse Timer v${currentVersion}\n`);

          const comparisonInfo = latestTag ? ` > ${latestTag}` : ' (no prior release tag found)';
          console.log(`Release version validated: v${currentVersion}${comparisonInfo}`);
          NODE

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: local-mobile-builds-${{ github.run_id }}
          path: artifacts/submission

      - name: Validate submission artifacts
        run: |
          set -euo pipefail
          platform="${{ github.event.inputs.platform || 'all' }}"
          artifact_root="${{ github.workspace }}/artifacts/submission"

          if [ "$platform" = "all" ] || [ "$platform" = "ios" ]; then
            if [ ! -f "$artifact_root/ios.ipa" ]; then
              echo "Missing iOS artifact at $artifact_root/ios.ipa."
              exit 1
            fi
          fi

          if [ "$platform" = "all" ] || [ "$platform" = "android" ]; then
            if [ ! -f "$artifact_root/android.aab" ]; then
              echo "Missing Android artifact at $artifact_root/android.aab."
              exit 1
            fi
          fi

      - name: Prepare GitHub release assets
        id: release_assets
        shell: bash
        run: |
          set -euo pipefail
          platform="${{ github.event.inputs.platform || 'all' }}"
          files=()

          if [ "$platform" = "all" ] || [ "$platform" = "ios" ]; then
            files+=("artifacts/submission/ios.ipa")
          fi

          if [ "$platform" = "all" ] || [ "$platform" = "android" ]; then
            files+=("artifacts/submission/android.aab")
          fi

          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload iOS artifact to App Store Connect
        if: ${{ (github.event.inputs.platform || 'all') == 'all' || (github.event.inputs.platform || 'all') == 'ios' }}
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: artifacts/submission/ios.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Upload Android artifact to Google Play
        if: ${{ (github.event.inputs.platform || 'all') == 'all' || (github.event.inputs.platform || 'all') == 'android' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.lallimaven.eclipsetimer
          releaseFiles: artifacts/submission/android.aab
          track: internal

      - name: Create GitHub release with mobile artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          generate_release_notes: true
          files: ${{ steps.release_assets.outputs.files }}
