name: EAS Build & Submit

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - ios
          - android
      submit:
        description: "Submit to stores after build"
        required: false
        default: false
        type: boolean

concurrency:
  group: eas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  build:
    name: EAS Build (${{ github.event.inputs.platform || 'all' }})
    needs: ci
    runs-on: ubuntu-latest
    env:
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Validate Google Maps Android key
        if: ${{ (github.event.inputs.platform || 'all') != 'ios' }}
        run: |
          if [ -z "$GOOGLE_MAPS_ANDROID_API_KEY" ]; then
            echo "Missing GOOGLE_MAPS_ANDROID_API_KEY GitHub secret."
            echo "Add it in: Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Build
        working-directory: apps/mobile
        run: eas build --profile production --platform ${{ github.event.inputs.platform || 'all' }} --non-interactive

  submit:
    name: Submit to stores
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.submit == 'true'
    runs-on: ubuntu-latest
    environment: production # Requires manual approval in GitHub settings

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to App Store Connect & Google Play
        working-directory: apps/mobile
        run: eas submit --platform ${{ github.event.inputs.platform || 'all' }} --non-interactive --latest
